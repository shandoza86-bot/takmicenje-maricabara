    let p = l.split('|');
    return {
      n: p.at(0),
      team: "Остали / Без екипе",
      logo: "",
      r: p.slice(1).map(x => {
        let parts = x.split(',');
        let bVal = +parts.at(0) || 0;
        let gVal = +parts.at(1) || 0;
        let stVal = (bVal === 0 && gVal === 0) ? 'bonus' : (bVal >= 11 && gVal === 0 ? 'nofish' : 'fished');
        return { b: bVal, g: gVal, st: stVal };
      })
    };
  });
}

let d = parseDefault();
let teams = [...defaultTeams];
let meta = { title: "🎣 ПОЈЕДИНАЧНО ТАКМИЧЕЊЕ 2026", sp1: "", sp2: "", noFishPts: 11 };
let editingTeamIdx = -1;

try {
  let s = localStorage.getItem('p26_ind_v2');
  if (s) {
    let parsed = JSON.parse(s);
    if (Array.isArray(parsed) && parsed.length > 0) {
      d = parsed.map(t => ({ n: t.n, team: t.team || "Остали / Без екипе", logo: t.logo || "", r: t.r }));
    }
  }
  let tm = localStorage.getItem('p26_ind_teams');
  if (tm) {
    let parsedTeams = JSON.parse(tm);
    if (Array.isArray(parsedTeams) && parsedTeams.length > 0) teams = parsedTeams;
  }
  let m = localStorage.getItem('p26_ind_meta_v2');
  if (m) meta = Object.assign(meta, JSON.parse(m));
} catch (e) {}

const st = () => {
  try {
    localStorage.setItem('p26_ind_v2', JSON.stringify(d));
    localStorage.setItem('p26_ind_teams', JSON.stringify(teams));
    localStorage.setItem('p26_ind_meta_v2', JSON.stringify(meta));
  } catch (e) {
    alert("Меморија прегледача је пуна. Покушајте са мањим сликама.");
  }
};
function resizeImage(file, maxSize, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
      else if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/png', 0.85));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  document.title = meta.title.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim() || "Појединачно такмичење";
  let leftLogo = meta.sp1 ? `<img src="${meta.sp1}" class="hd-logo" alt="Лого 1">` : '';
  let rightLogo = meta.sp2 ? `<img src="${meta.sp2}" class="hd-logo" alt="Лого 2">` : '';
  document.getElementById('mainHeader').innerHTML = `${leftLogo}<span class="hd-title">${meta.title}</span>${rightLogo}`;
  document.getElementById('leagueNameInp').value = meta.title;
  document.getElementById('noFishPtsInp').value = meta.noFishPts || 11;

  let clrHtml = '';
  if (meta.sp1) clrHtml += `<button class="bt-sm bt-del" style="flex:1" onclick="clearSponsor(1)">Уклони Лого 1</button>`;
  if (meta.sp2) clrHtml += `<button class="bt-sm bt-del" style="flex:1" onclick="clearSponsor(2)">Уклони Лого 2</button>`;
  document.getElementById('spClearRow').innerHTML = clrHtml;
}

function saveLeagueTitleInp() {
  const val = document.getElementById('leagueNameInp').value.trim();
  if (val !== "") { meta.title = val; st(); renderHeader(); }
}

function saveNoFishPts() {
  const val = parseFloat(document.getElementById('noFishPtsInp').value);
  if (!isNaN(val) && val >= 0) {

    st();
    inps();
    renderAverages();
    alert(`✅ Подешено: „Није пецао“ сада уписује ${val} бод / 0 г.`);

function uploadSponsor(num, input) {
  if (!input.files || input.files.length === 0) return;
  resizeImage(input.files.item(0), 180, (dataUrl) => {
    if (num === 1) meta.sp1 = dataUrl; else meta.sp2 = dataUrl;
    st(); renderHeader(); input.value = '';
  });
}

function clearSponsor(num) {
  if (num === 1) meta.sp1 = ""; else meta.sp2 = "";
  st(); renderHeader();
}

const ks = document.getElementById('ks');
for (let i = 1; i <= 10; i++) ks.innerHTML += `<option value="${i-1}">${i}. КОЛО</option>`;

function srt() {
  return d.map(t => {
    let b = 0, g = 0;
    t.r.forEach(x => { b += +x.b || 0; g += +x.g || 0; });
    return { n: t.n, team: t.team, logo: t.logo, r: t.r, b, g };
  }).sort((a, b) => a.b !== b.b ? a.b - b.b : b.g - a.g);
}

    2: { c1: '#ffffff', c2: '#cbd5e1', c3: '#64748b', base: '#334155', num: '#1e293b' },
    3: { c1: '#fed7aa', c2: '#ea580c', c3: '#9a3412', base: '#431407', num: '#431407' },
    4: { c1: '#bfdbfe', c2: '#3b82f6', c3: '#1d4ed8', base: '#1e3a8a', num: '#ffffff' },
    5: { c1: '#a7f3d0', c2: '#10b981', c3: '#047857', base: '#064e3b', num: '#ffffff' }
  };
  const p = palettes[place];
  const gid = 'tg' + place;
  return `<svg class="trophy-3d" viewBox="0 0 64 64" xmlns="http://w3.org">
    <defs>
      <linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%">

        <stop offset="50%" stop-color="${p.c2}"/>

    </defs>
    <path d="M16 14 H8 C5 14 4 22 10 27 C13 30 17 31 20 31" fill="none" stroke="url(#${gid})" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 14 H56 C59 14 60 22 54 27 C51 30 47 31 44 31" fill="none" stroke="url(#${gid})" stroke-width="4" stroke-linecap="round"/>
    <path d="M16 10 H48 L44 32 C43 39 38 43 32 43 C26 43 21 39 20 32 Z" fill="url(#${gid})" stroke="${p.c3}" stroke-width="1.5"/>
    <path d="M21 13 H26 L24 31 C22 28 21 22 21 13 Z" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="29" y="42" width="6" height="9" fill="url(#${gid})"/>
    <path d="M21 51 H43 L46 58 H18 Z" fill="${p.base}"/>
    <rect x="22" y="52" width="20" height="3" fill="url(#${gid})"/>
    <text x="32" y="30" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="${p.num}">${place}</text>
  </svg>`;
}

      topHtml += `<div class="podium-card pod-${i+1}">

function toggleFished(i) {
  const chk = document.getElementById('chk' + i);
  const bEl = document.getElementById('b' + i);
  const gEl = document.getElementById('g' + i);
  const stEl = document.getElementById('st' + i);
  if (chk.checked) {
    stEl.value = 'fished';
    bEl.disabled = false;
    gEl.disabled = false;
    if (+bEl.value === +(meta.noFishPts || 11) && +gEl.value === 0) bEl.value = 0;
  } else {
    setNoFish(i);
  }
}

function setBonus(i) {
  document.getElementById('chk' + i).checked = false;
  document.getElementById('st' + i).value = 'bonus';
  const bEl = document.getElementById('b' + i);
  const gEl = document.getElementById('g' + i);
  bEl.value = 0; gEl.value = 0;
  bEl.disabled = true; gEl.disabled = true;
}

function setNoFish(i) {
  document.getElementById('chk' + i).checked = false;
  document.getElementById('st' + i).value = 'nofish';
  const bEl = document.getElementById('b' + i);
  const gEl = document.getElementById('g' + i);
  bEl.value = meta.noFishPts || 11; gEl.value = 0;
  bEl.disabled = true; gEl.disabled = true;
}

function inps() {
  let k = +ks.value;
  let selTeam = document.getElementById('es').value || teams.at(0);
  let noPts = meta.noFishPts || 11;

  let filtered = d.map((t, i) => ({ t, i })).filter(item => item.t.team === selTeam);

  if (filtered.length === 0) {
    document.getElementById('in').innerHTML = `<div class="cd" style="text-align:center; color:#64748b; font-weight:bold;">Нема додатих такмичара у овој екипи. Додај их у табу ⚙️ ТАКМИЧАРИ.</div>`;
    return;
  }

  document.getElementById('in').innerHTML = filtered.map(({ t, i }) => {
    let x = t.r.at(k) || { b: 0, g: 0, st: 'nofish' };
    let status = x.st || ((+x.b === 0 && +x.g === 0) ? 'bonus' : (+x.b >= noPts && +x.g === 0 ? 'nofish' : 'fished'));
    let isFished = (status === 'fished');
    let logoHtml = t.logo ? `<img src="${t.logo}" class="t-logo" style="width:24px;height:24px;" alt="">` : '';

    return `<div class="cd">
      <input type="hidden" id="st${i}" value="${status}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;">
          <input type="checkbox" class="chk-pecao" id="chk${i}" ${isFished ? 'checked' : ''} onchange="toggleFished(${i})">
          ${logoHtml}
          <div><b>${t.n}</b></div>
        </label>
        <div style="display:flex;gap:4px;">
          <button type="button" class="bt-sm bt-bon" onclick="setBonus(${i})">🎁 Бонус</button>
          <button type="button" class="bt-sm bt-no" onclick="setNoFish(${i})">🚫 Није пецао (${noPts})</button>
        </div>
      </div>
      <div class="gr">
        <div><small>Бодови</small><input type="number" step="0.5" id="b${i}" value="${x.b}" ${!isFished ? 'disabled' : ''}></div>
        <div><small>Грами</small><input type="number" id="g${i}" value="${x.g}" ${!isFished ? 'disabled' : ''}></div>
      </div>
    </div>`;
  }).join('');
}

function renderAverages() {
  let html = '';
  let noPts = meta.noFishPts || 11;
  teams.forEach(tm => {
    const members = d.filter(p => p.team === tm);
    if (members.length === 0) return;

    let totalCountedRounds = 0, totalTeamPts = 0, totalTeamGrams = 0;

    let rowsHtml = members.map(p => {
      let rounds = 0, pts = 0, grams = 0;
      p.r.forEach(x => {
        let status = x.st || ((+x.b === 0 && +x.g === 0) ? 'bonus' : (+x.b >= noPts && +x.g === 0 ? 'nofish' : 'fished'));
        if (status !== 'bonus') {
          rounds++;
          pts += +x.b || 0;
          grams += +x.g || 0;
        }
      });
      totalCountedRounds += rounds; totalTeamPts += pts; totalTeamGrams += grams;

      let avgB = rounds > 0 ? (pts / rounds).toFixed(2) : '0.00';
      let avgG = rounds > 0 ? Math.round(grams / rounds) : 0;
      return `<div class="rw">
        <div class="t-info"><div><span class="t-name">${p.n}</span><span class="t-sub">Рачунато кола (без бонуса): ${rounds}</span></div></div>
        <div style="text-align:right;">
          <b style="color:#0f172a; font-size:13.5px;">Просек: ${avgB} бод.</b><br>
          <small style="color:#0284c7; font-weight:700;">${avgG} г / колу</small>
        </div>
      </div>`;
    }).join('');

    let teamAvgB = totalCountedRounds > 0 ? (totalTeamPts / totalCountedRounds).toFixed(2) : '0.00';
    let teamAvgG = totalCountedRounds > 0 ? Math.round(totalTeamGrams / totalCountedRounds) : 0;

    html += `<div class="cd">
      <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; color:#fff; padding:8px 10px; border-radius:9px; margin-bottom:8px;">
        <b style="font-size:14px;">${tm}</b>
        <span style="font-size:12px; color:#38bdf8; font-weight:800;">Просек екипе: ${teamAvgB} бод. | ${teamAvgG} г</span>
      </div>
      ${rowsHtml}
    </div>`;
  });

  document.getElementById('p5').innerHTML = html || `<div class="cd">Нема података за просек.</div>`;
}
function mng() {
  const q = (document.getElementById('searchMng')?.value || '').trim().toLowerCase();
  const filtered = d.map((t, i) => ({ t, i })).filter(item =>
    item.t.n.toLowerCase().includes(q) || (item.t.team || '').toLowerCase().includes(q)
  );

  document.getElementById('mg').innerHTML =
    `<div class="sec-title">Такмичари (${filtered.length} / ${d.length})</div>` +
    filtered.map(({ t, i }) => {
      let logoHtml = t.logo ? `<img src="${t.logo}" class="t-logo" alt="">` : '';
      let delLogoBtn = t.logo ? `<button class="bt-sm" style="background:#64748b;" onclick="clearTeamLogo(${i})">✖</button>` : '';
      let teamOpts = teams.map(tm => `<option value="${tm}" ${t.team === tm ? 'selected' : ''}>${tm}</option>`).join('');
      let nameArea = (editingTeamIdx === i)
        ? `<div style="display:flex; gap:5px; width:100%; margin-top:6px;">
             <input type="text" id="edInp${i}" value="${t.n}">
             <button class="bt-sm" style="background:#16a34a; padding:0 12px;" onclick="saveEditTeam(${i})">💾</button>
             <button class="bt-sm" style="background:#64748b; padding:0 10px;" onclick="cancelEditTeam()">✖</button>
           </div>`
        : '';
      return `<div class="rw">
        <div class="t-info">
          ${logoHtml}
          <div style="flex:1; min-width:0;">
            <span style="font-weight:bold; font-size:13.5px; display:block;">${t.n}</span>
            <select style="padding:4px 6px; font-size:12px; margin-top:3px;" onchange="changePlayerTeam(${i}, this.value)">${teamOpts}</select>
          </div>
        </div>
        <div style="display:flex; gap:4px; flex-shrink:0;">
          <input type="file" id="tFile${i}" accept="image/*" class="file-mob" onchange="uploadTeamLogoDirect(${i}, this)">
          <label for="tFile${i}" class="bt-sm bt-logo">🖼️</label>${delLogoBtn}
          <button class="bt-sm bt-ed" onclick="startEditTeam(${i})">✏️</button>
          <button class="bt-sm bt-del" onclick="del(${i})">🗑️</button>
        </div>
        ${nameArea}
      </div>`;
    }).join('');
}

function changePlayerTeam(i, newTeam) { d.at(i).team = newTeam; st(); renderAverages(); rnk(); inps(); }
function startEditTeam(i) { editingTeamIdx = i; mng(); }
function cancelEditTeam() { editingTeamIdx = -1; mng(); }
function saveEditTeam(i) {
  const val = document.getElementById('edInp' + i).value.trim();
  if (val !== "") { d.at(i).n = val; editingTeamIdx = -1; st(); all(); }
}

function add() {
  let v = document.getElementById('nt').value.trim();
  let tm = document.getElementById('ntTeam').value || "Остали / Без екипе";
  if (!v) return;
  let noPts = meta.noFishPts || 11;
  d.push({ n: v, team: tm, logo: "", r: Array.from({ length: 10 }, () => ({ b: noPts, g: 0, st: 'nofish' })) });
  document.getElementById('nt').value = '';
  st(); all();
}

function del(i) {
  if (confirm('Обрисати такмичара ' + d.at(i).n + '?')) { d.splice(i, 1); editingTeamIdx = -1; st(); all(); }
}

function sav() {
  let k = +ks.value;
  d.forEach((t, i) => {
    const bEl = document.getElementById('b' + i);
    const gEl = document.getElementById('g' + i);
    const stEl = document.getElementById('st' + i);
    if (bEl && gEl && stEl) {
      t.r.splice(k, 1, { b: +bEl.value || 0, g: +gEl.value || 0, st: stEl.value });
    }
  });
  st(); all(); tab(1);
}

function tab(n) {
  for (let i = 1; i <= 5; i++) {
    document.getElementById('p' + i).className = i === n ? (i === 3 ? 'cd' : '') : 'hi';
    document.getElementById('t' + i).className = i === n ? 'act' : '';
  }
}

function startNewSeason() {
  const yr = (document.getElementById('newSeasonYear').value || '2027').trim();
  const numTeams = parseInt(document.getElementById('newSeasonTeams').value, 10);
  if (isNaN(numTeams) || numTeams < 1 || numTeams > 50) {
    alert('Унесите исправан број екипа (од 1 до 50).');
    return;
  }
  if (!confirm(`Да ли желите да покренете нову сезону ${yr} са ${numTeams} екипа (по 3 такмичара у свакој)?\n\nПретходно ће бити сачувана архива тренутне сезоне!`)) {
    return;
  }

  exportBackup('Arhiva_Sezona_' + (meta.title.match(/\d{4}/)?.at(0) || '2026') + '.txt');

  let newTeams = [];
  let newPlayers = [];
  let noPts = meta.noFishPts || 11;

  for (let t = 1; t <= numTeams; t++) {
    let tName = `Екипа ${t}`;
    newTeams.push(tName);
    for (let p = 1; p <= 3; p++) {
      newPlayers.push({
        n: `Такмичар ${t}.${p}`,
        team: tName,
        logo: "",
        r: Array.from({ length: 10 }, () => ({ b: noPts, g: 0, st: 'nofish' }))
      });
    }
  }
  newTeams.push("Остали / Без екипе");

  teams = newTeams;
  d = newPlayers;
  meta.title = `🎣 ПОЈЕДИНАЧНО ТАКМИЧЕЊЕ ${yr}`;
  st();
  all();
  alert(`✅ Нова сезона ${yr} је креирана!\nДодато је ${numTeams} екипа и ${numTeams * 3} такмичара.`);
}
function loadImgAsync(src) {
  return new Promise(resolve => {
    if (!src) return resolve(null);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

async function buildPodiumCanvas() {
  const list = srt();
  const W = 820;
  const topCount = Math.min(5, list.length);
  const restCount = Math.max(0, list.length - 5);
  const H = 175 + topCount * 94 + (restCount > 0 ? restCount * 66 + 30 : 0) + 40;

  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#06283D'); grad.addColorStop(0.5, '#0E4D64'); grad.addColorStop(1, '#1B4332');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(15, 23, 42, 0.88)'; ctx.fillRect(0, 0, W, 118);
  ctx.fillStyle = 'rgba(56, 189, 248, 0.45)'; ctx.fillRect(0, 116, W, 3);

  const [imgSp1, imgSp2] = await Promise.all([loadImgAsync(meta.sp1), loadImgAsync(meta.sp2)]);
  const teamImgs = await Promise.all(list.map(t => loadImgAsync(t.logo)));

  if (imgSp1) { ctx.fillStyle = '#fff'; drawRoundedRect(ctx, 26, 20, 78, 78, 14); ctx.fill(); ctx.drawImage(imgSp1, 30, 24, 70, 70); }
  if (imgSp2) { ctx.fillStyle = '#fff'; drawRoundedRect(ctx, W - 104, 20, 78, 78, 14); ctx.fill(); ctx.drawImage(imgSp2, W - 100, 24, 70, 70); }

  const cleanTitle = meta.title.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim().toUpperCase();
  ctx.fillStyle = '#ffffff'; ctx.font = '900 26px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(cleanTitle, W / 2, 68); ctx.textAlign = 'left';

  let y = 142;
  const colors = [
    ['#fffbeb', '#fde68a', '#f59e0b'],
    ['#f8fafc', '#cbd5e1', '#64748b'],
    ['#fff7ed', '#fed7aa', '#c2410c'],
    ['#eff6ff', '#bfdbfe', '#2563eb'],
    ['#ecfdf5', '#a7f3d0', '#059669']
  ];

  for (let i = 0; i < topCount; i++) {
    const t = list.at(i), col = colors.at(i);
    const cardGrad = ctx.createLinearGradient(30, y, W - 30, y + 80);
    cardGrad.addColorStop(0, col.at(0)); cardGrad.addColorStop(1, col.at(1));
    ctx.fillStyle = cardGrad; ctx.strokeStyle = col.at(2); ctx.lineWidth = 3;
    drawRoundedRect(ctx, 30, y, W - 60, 80, 16); ctx.fill(); ctx.stroke();

    ctx.fillStyle = col.at(2); ctx.beginPath(); ctx.arc(74, y + 40, 23, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = '900 20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🏆' + (i + 1), 74, y + 48); ctx.textAlign = 'left';

    let nameX = 114;
    if (teamImgs.at(i)) {
      ctx.save(); ctx.beginPath(); ctx.arc(136, y + 40, 23, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(teamImgs.at(i), 113, y + 17, 46, 46); ctx.restore();
      nameX = 172;
    }

    ctx.fillStyle = '#0f172a'; ctx.font = '800 23px sans-serif';
    ctx.fillText(t.n.substring(0, 24), nameX, y + 47);

    ctx.textAlign = 'right'; ctx.font = '900 23px sans-serif';
    ctx.fillText(t.b + ' бод.', W - 50, y + 37);
    ctx.fillStyle = '#334155'; ctx.font = '700 17px sans-serif';
    ctx.fillText(t.g + ' г', W - 50, y + 62); ctx.textAlign = 'left';

    y += 94;
  }

  if (restCount > 0) {
    const boxH = restCount * 66 + 16;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.97)';
    drawRoundedRect(ctx, 30, y, W - 60, boxH, 16); ctx.fill();

    let ry = y + 8;
    for (let i = 5; i < list.length; i++) {
      const t = list.at(i);
      if (i > 5) {
        ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(50, ry); ctx.lineTo(W - 50, ry); ctx.stroke();
      }
      ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.arc(72, ry + 33, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = '800 17px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(i + 1, 72, ry + 39); ctx.textAlign = 'left';

      let nameX = 106;
      if (teamImgs.at(i)) {
        ctx.save(); ctx.beginPath(); ctx.arc(126, ry + 33, 20, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(teamImgs.at(i), 106, ry + 13, 40, 40); ctx.restore();
        nameX = 156;
      }
      ctx.fillStyle = '#0f172a'; ctx.font = '800 21px sans-serif';
      ctx.fillText(t.n.substring(0, 25), nameX, ry + 40);

      ctx.textAlign = 'right'; ctx.font = '800 21px sans-serif';
      ctx.fillText(t.b + ' бод.', W - 50, ry + 30);
      ctx.fillStyle = '#64748b'; ctx.font = '600 16px sans-serif';
      ctx.fillText(t.g + ' г', W - 50, ry + 53); ctx.textAlign = 'left';

      ry += 66;
    }
  }
  return c;
}
async function buildTableCanvas() {
  const list = srt(), W = 1720, H = Math.max(1190, 270 + list.length * 60);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1b4332'; ctx.fillRect(40, 35, W - 80, 80);

  const [imgSp1, imgSp2] = await Promise.all([loadImgAsync(meta.sp1), loadImgAsync(meta.sp2)]);
  const teamImgs = await Promise.all(list.map(t => loadImgAsync(t.logo)));

  let titleStartX = 65;
  if (imgSp1) { ctx.fillStyle = '#fff'; ctx.fillRect(52, 43, 64, 64); ctx.drawImage(imgSp1, 54, 45, 60, 60); titleStartX = 135; }
  if (imgSp2) { ctx.fillStyle = '#fff'; ctx.fillRect(W - 116, 43, 64, 64); ctx.drawImage(imgSp2, W - 114, 45, 60, 60); }

  const cleanTitle = meta.title.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim().toUpperCase();
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 30px sans-serif';
  ctx.fillText(cleanTitle + ' - ЗБИРНА РАНГ ЛИСТА', titleStartX, 85);

  let y = 160;
  ctx.fillStyle = '#2d6a4f'; ctx.fillRect(40, y - 35, W - 80, 50);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px sans-serif';
  ctx.fillText('МЕСТО / ТАКМИЧАР', 55, y - 3);
  for (let k = 1; k <= 10; k++) ctx.fillText(k + '. КОЛО', 395 + (k - 1) * 107, y - 3);
  ctx.fillText('УК.БОД', 1470, y - 3); ctx.fillText('УК.ГР', 1585, y - 3);
  y += 52;

  list.forEach((t, i) => {
    if (i < 5) { ctx.fillStyle = i === 0 ? '#fef3c7' : (i === 1 ? '#f1f5f9' : (i === 2 ? '#ffedd5' : (i === 3 ? '#eff6ff' : '#ecfdf5'))); ctx.fillRect(40, y - 34, W - 80, 52); }
    else if (i % 2 === 1) { ctx.fillStyle = '#f8fafc'; ctx.fillRect(40, y - 34, W - 80, 52); }

    ctx.strokeStyle = '#cbd5e1'; ctx.beginPath(); ctx.moveTo(40, y + 18); ctx.lineTo(W - 40, y + 18); ctx.stroke();
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 19px sans-serif'; ctx.fillText((i + 1) + '.', 55, y);

    let nameX = 92;
    if (teamImgs.at(i)) { ctx.drawImage(teamImgs.at(i), 90, y - 22, 32, 32); nameX = 132; }
    ctx.fillText(t.n.substring(0, 22), nameX, y);

    for (let k = 0; k < 10; k++) {
      let r = t.r.at(k) || { b: 0, g: 0 };
      let colX = 395 + k * 107;
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(r.b + ' /', colX, y);
      let wB = ctx.measureText(r.b + ' / ').width;
      ctx.fillStyle = '#475569'; ctx.font = '15px sans-serif'; ctx.fillText(r.g + 'г', colX + wB, y);
    }

    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText(t.b, 1470, y); ctx.fillText(t.g, 1585, y);
    y += 52;
  });
  return c;
}

async function makeReport(type) {
  const canvas = (type === 'podium') ? await buildPodiumCanvas() : await buildTableCanvas();
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  document.getElementById('prevBox').className = '';
  document.getElementById('prevImg').src = dataUrl;

  if (type === 'pdf') {
    document.getElementById('printImg').src = dataUrl;
    setTimeout(() => { window.print(); }, 250);
    return;
  }

  const fname = type === 'podium' ? 'Pojedinacno_Rang_2026.jpg' : 'Pojedinacno_Tabela_2026.jpg';
  canvas.toBlob(async (blob) => {
    const file = new File([blob], fname, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: meta.title }); return; } catch (e) {}
    }
    const a = document.createElement('a'); a.href = dataUrl; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }, 'image/jpeg', 0.92);
}

async function downloadExcel() {
  const ranked = srt();
  const rankMap = new Map();
  ranked.forEach((t, idx) => rankMap.set(t.n, { place: idx + 1, b: t.b, g: t.g }));
  const cleanTitle = meta.title.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim().toUpperCase();

  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://w3.org">
  <head><meta charset="UTF-8"><style>
    table { border-collapse: collapse; font-family: Calibri, Arial, sans-serif; font-size: 11pt; }
    th, td { border: 1px solid #000000; padding: 5px 8px; text-align: center; vertical-align: middle; }
    .top-hd { background-color: #1b4332; color: #ffffff; font-weight: bold; font-size: 13pt; }
    .sub-hd { background-color: #e2e8f0; color: #000000; font-weight: bold; font-size: 12pt; }
    .col-hd { background-color: #2d6a4f; color: #ffffff; font-weight: bold; }
    .col-sub { background-color: #d8f3dc; color: #000000; font-weight: bold; font-size: 10pt; }
    .team-col { text-align: left; font-weight: bold; }
    .tot-col { font-weight: bold; background-color: #f8fafc; }
    .place-col { font-weight: bold; background-color: #fef3c7; }
  </style></head><body><table>`;

  html += `<tr><td colspan="26" class="top-hd">${cleanTitle}</td></tr>`;
  html += `<tr><td colspan="26" class="sub-hd">ЗБИРНА ТАБЕЛА РЕЗУЛТАТА - ПОЈЕДИНАЧНО</td></tr>`;
  html += `<tr><th rowspan="2" class="col-hd">ИМЕ И ПРЕЗИМЕ</th><th rowspan="2" class="col-hd">ЕКИПА</th>`;
  for (let k = 1; k <= 10; k++) html += `<th colspan="2" class="col-hd">${k}. КОЛО</th>`;
  html += `<th rowspan="2" class="col-hd">УК. БОД.</th><th rowspan="2" class="col-hd">УК. ГР.</th><th rowspan="2" class="col-hd">МЕСТО</th><th rowspan="2" class="col-hd">ИМЕ И ПРЕЗИМЕ</th></tr><tr>`;
  for (let k = 1; k <= 10; k++) html += `<th class="col-sub">БОДОВИ</th><th class="col-sub">ГРАМИ</th>`;
  html += `</tr>`;

  d.forEach(t => {
    let info = rankMap.get(t.n) || { place: '-', b: 0, g: 0 };
    html += `<tr><td class="team-col">${t.n}</td><td>${t.team || ''}</td>`;
    for (let k = 0; k < 10; k++) {
      let r = t.r.at(k) || { b: 0, g: 0 };
      html += `<td>${String(r.b).replace('.', ',')}</td><td>${r.g}</td>`;
    }
    html += `<td class="tot-col">${String(info.b).replace('.', ',')}</td><td class="tot-col">${info.g}</td><td class="place-col">${info.place}</td><td class="team-col">${t.n}</td></tr>`;
  });
  html += `</table></body></html>`;

  const blob = new Blob(['\uFEFF' + html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  const file = new File([blob], 'Pojedinacno_2026.xls', { type: 'application/vnd.ms-excel' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: meta.title }); return; } catch (e) {}
  }
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href = url; link.download = 'Pojedinacno_2026.xls';
  document.body.appendChild(link); link.click();
  setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(url); }, 500);
}

function getBackupPayload() {
  const cleanD = d.map(t => ({ n: t.n, team: t.team, logo: "", r: t.r }));
  const cleanMeta = { title: meta.title, sp1: "", sp2: "", noFishPts: meta.noFishPts };
  return JSON.stringify({ d: cleanD, teams: teams, meta: cleanMeta });
}

function exportBackup(customName) {
  const payload = getBackupPayload();
  const fname = customName || 'Pojedinacno_Backup.txt';

  document.getElementById('pasteBackupBox').classList.remove('hi');
  document.getElementById('backupTxtArea').value = payload;

  try {
    const blob = new Blob([payload], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 500);
  } catch (e) {}
}

function copyBackupText() {
  const area = document.getElementById('backupTxtArea');
  if (!area.value) area.value = getBackupPayload();
  area.select();
  area.setSelectionRange(0, 999999);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(area.value).then(() => alert('✅ Backup текст је копиран!'));
  } else {
    document.execCommand('copy');
    alert('✅ Backup текст је копиран!');
  }
}

function applyParsedBackup(parsed) {
  if (parsed && Array.isArray(parsed.d) && parsed.d.length > 0) {
    d = parsed.d.map(t => ({ n: t.n, team: t.team || "Остали / Без екипе", logo: t.logo || "", r: t.r }));
    if (Array.isArray(parsed.teams) && parsed.teams.length > 0) teams = parsed.teams;
    if (parsed.meta) meta = Object.assign(meta, parsed.meta);
    st(); all(); tab(1);
    alert('✅ Резервна копија је успешно учитана!');
  } else {
    alert('⚠️ Неисправан Backup фајл.');
  }
}

function importBackup(input) {
  if (!input.files || input.files.length === 0) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      let rawTxt = String(e.target.result || '').replace(/^\uFEFF/, '').trim();
      applyParsedBackup(JSON.parse(rawTxt));
    } catch (err) {
      alert('⚠️ Грешка при читању фајла: ' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(input.files.item(0), 'UTF-8');
}

function togglePasteBackup() {
  const box = document.getElementById('pasteBackupBox');
  box.classList.toggle('hi');
  if (!box.classList.contains('hi') && !document.getElementById('backupTxtArea').value) {
    document.getElementById('backupTxtArea').value = getBackupPayload();
  }
}

function loadBackupFromText() {
  try {
    let rawTxt = (document.getElementById('backupTxtArea').value || '').trim();
    if (!rawTxt) return;
    applyParsedBackup(JSON.parse(rawTxt));
    document.getElementById('backupTxtArea').value = '';
    document.getElementById('pasteBackupBox').classList.add('hi');
  } catch (err) {
    alert('⚠️ Неисправан текст резервне копије.');
  }
}

function all() {
  renderHeader();
  renderTeamSelects();
  rnk();
  inps();
  renderAverages();
  mng();
}

all();
tab(1);
